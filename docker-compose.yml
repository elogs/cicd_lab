version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jenkins
      - gitea
      - nexus
      - sonarqube

  jenkins:
    image: jenkins/jenkins:lts
    expose:
      - "8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  gitea:
    image: gitea/gitea:latest
    expose:
      - "3000"
    volumes:
      - gitea_data:/data

  nexus:
    image: sonatype/nexus3
    expose:
      - "8081"
    volumes:
      - nexus_data:/nexus-data

  sonarqube:
    image: sonarqube:lts
    expose:
      - "9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

volumes:
  jenkins_home:
  gitea_data:
  nexus_data: